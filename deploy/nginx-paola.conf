# /etc/nginx/sites-available/paola.conf  (sites-enabled/paola.conf apunta ahí)
# Tarjeta digital de Paola: HTML estático en /var/www/paola, sin backend.
#
# Instalación completa (DNS + cert + vhost): deploy/setup-vps.sh.
# Solo actualizar el vhost:
#   scp deploy/nginx-paola.conf root@VPS:/etc/nginx/sites-available/paola.conf
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name paola.robertobh.dev;

    # Lo necesita certbot para renovar (http-01). Todo lo demás va a https.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/paola;
    }
    location / {
        return 301 https://paola.robertobh.dev$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paola.robertobh.dev;

    root /var/www/paola;
    index index.html;
    error_page 404 /404.html;

    ssl_certificate     /etc/letsencrypt/live/paola.robertobh.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paola.robertobh.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # nginx no trae vcf en mime.types; sin el tipo correcto iOS muestra el contacto como
    # texto. Se sobreescribe SOLO en esta location (types{} vacío + default_type), para no
    # tirar el mapa global de mime.types del resto del vhost.
    location ~* \.vcf$ {
        types { }
        default_type text/vcard;
        expires 1d;
        try_files $uri =404;
    }

    # nginx tampoco mapea .webmanifest (saldría como octet-stream).
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        expires 1d;
    }

    # El 404 generado (redirige a la tarjeta) solo por redirección interna.
    location = /404.html {
        internal;
    }

    # Cabeceras de seguridad. CSP: todo inline (CSS y el script de la tarjeta) y, si se
    # activa la analítica, el motor Umami de stats.robertobh.dev.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://stats.robertobh.dev; connect-src 'self' https://stats.robertobh.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    # La entrada nunca se cachea: los cambios de datos se ven al instante.
    # Se usa expires y no add_header: add_header en una location descarta las cabeceras
    # heredadas del server (CSP, HSTS...), expires no.
    location = /index.html {
        expires -1;
    }

    # Fuentes: mime.types viejos no traen woff2; se fija aquí. Un mes de caché.
    location ~* \.woff2$ {
        types { }
        default_type font/woff2;
        expires 30d;
        try_files $uri =404;
    }

    # Vectores de marca: no cambian; un mes.
    location ^~ /brand/ {
        expires 30d;
        try_files $uri =404;
    }

    # Imágenes y texto: un día. El QR impreso no cambia.
    location ~* \.(svg|png|jpg|jpeg|webp|ico|txt|xml)$ {
        expires 1d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/vcard application/json application/javascript image/svg+xml application/manifest+json;
}
