# /etc/nginx/sites-available/paola.conf  (sites-enabled/paola.conf apunta ahí)
# Tarjeta digital de Paola: HTML estático en /var/www/paola, sin backend.
#
# Instalación completa (DNS + cert + vhost): deploy/setup-vps.sh.
# Solo actualizar el vhost:
#   scp deploy/nginx-paola.conf root@VPS:/etc/nginx/sites-available/paola.conf
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name paola.robertobh.dev;

    # Lo necesita certbot para renovar (http-01). Todo lo demás va a https.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/paola;
    }
    location / {
        return 301 https://paola.robertobh.dev$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paola.robertobh.dev;

    root /var/www/paola;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/paola.robertobh.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paola.robertobh.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # nginx no trae vcf en mime.types; sin esto iOS abre el contacto como texto.
    types {
        text/vcard                       vcf;
        text/html                        html;
        text/css                         css;
        application/javascript           js;
        application/manifest+json        webmanifest;
        image/svg+xml                    svg;
        image/png                        png;
        image/jpeg                       jpg jpeg;
        image/webp                       webp;
        image/x-icon                     ico;
        text/plain                       txt;
    }

    # Cabeceras de seguridad. CSP: todo inline (CSS y el script de la tarjeta) y, si se
    # activa la analítica, el motor Umami de stats.robertobh.dev.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://stats.robertobh.dev; connect-src 'self' https://stats.robertobh.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    # La entrada nunca se cachea: los cambios de datos se ven al instante.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://stats.robertobh.dev; connect-src 'self' https://stats.robertobh.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    }

    # vCard e imágenes: un día. La vCard cambia poco y el QR impreso no cambia.
    location ~* \.(vcf|svg|png|jpg|jpeg|webp|ico|webmanifest|txt)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/vcard application/json application/javascript image/svg+xml application/manifest+json;
}
