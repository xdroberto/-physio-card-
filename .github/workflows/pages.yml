# Deploy a GitHub Pages. Se dispara con push a main (hay que crear main: hoy la rama default es
# claude/paola-digital-business-card-gavg7r) o a mano: Actions → Run workflow desde la rama default.
#
# Pasos (una vez), en este orden: (1) DNS: CNAME paola → xdroberto.github.io; (2) Settings → Pages →
# Source: "GitHub Actions"; (3) Custom domain: paola.robertobh.dev; (4) Run workflow;
# (5) "Enforce HTTPS" cuando GitHub termine de emitir el certificado. Detalle en README.md.
name: "Deploy — GitHub Pages"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
