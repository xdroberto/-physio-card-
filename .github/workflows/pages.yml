# Deploy a GitHub Pages. Se dispara con push a main o a mano desde la pestaña Actions.
#
# Requisito único (una vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Dominio propio: Settings → Pages → Custom domain: paola.robertobh.dev (+ CNAME en el DNS
# apuntando a xdroberto.github.io). Marcar "Enforce HTTPS" cuando GitHub termine de emitir el cert.
name: "Deploy — GitHub Pages"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
